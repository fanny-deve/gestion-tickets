spring.application.name=ticket-system-backend

# ---- Base de datos: H2 embebida (para desarrollo local en cada equipo) ----
# No requiere instalar ningun motor de base de datos: el archivo se crea solo
# la primera vez que se ejecuta el backend, dentro de la carpeta backend/data/.
# AUTO_SERVER=TRUE permite que herramientas externas (como la consola H2 web,
# ver mas abajo) se conecten al mismo archivo mientras el backend corre.
spring.datasource.url=jdbc:h2:file:./data/ticketsystem;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola web de H2, util para ver las tablas y los datos de prueba sin
# instalar nada mas. Con el backend corriendo, abrir http://localhost:8080/h2-console
# JDBC URL a usar ahi: jdbc:h2:file:./data/ticketsystem
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Si mas adelante quieren desplegar contra PostgreSQL real (segun lo
# definido en el documento del proyecto), comenten las lineas de arriba y
# descomenten estas, ajustando host/usuario/clave segun corresponda: ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/ticketsystem
# spring.datasource.username=ticketsystem
# spring.datasource.password=ticketsystem
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
